name: Dev Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ dev ]
    paths-ignore:
      - '**.md'
      - 'crowdin.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/review.yml*'
  workflow_dispatch:

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release-dev:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Resolve Dev Version
      id: resolve_version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $baseMajor = 0
        $baseMinor = 0
        $basePatch = 0
        $cleanTag = $null

        # 1. Primary: Query GitHub for latest Stable release as baseline for odometer
        $candidateRepos = @($env:GITHUB_REPOSITORY, "LenovoLegionToolkit-Team/LenovoLegionToolkit") | Select-Object -Unique
        foreach ($repo in $candidateRepos) {
          if ($cleanTag) { break }
          try {
            $releasesList = gh release list --repo $repo --exclude-drafts --limit 30 --json tagName,name,isPrerelease,isLatest | ConvertFrom-Json
            if ($releasesList -and $releasesList.Count -gt 0) {
              $latestStable = $releasesList | Where-Object { -not $_.isPrerelease -and $_.name -notlike '*(Dev)*' -and $_.name -notlike '*(Beta)*' } | Select-Object -First 1
              if ($latestStable) {
                $cleanTag = $latestStable.tagName.TrimStart('v', 'V')
                $stableVer = $null
                if ([Version]::TryParse($cleanTag, [ref]$stableVer)) {
                  $baseMajor = $stableVer.Major
                  $baseMinor = $stableVer.Minor
                  $basePatch = if ($stableVer.Build -ge 0) { $stableVer.Build } else { 0 }
                  Write-Host "Found latest stable release in $($repo): $cleanTag. Base: $($baseMajor).$($baseMinor).$($basePatch)"
                }
              }
            }
          } catch {
            Write-Warning "Could not query GitHub releases directly for $($repo): $_"
          }
        }

        # 2. Fallback: Directory.Build.props if GitHub query yielded nothing
        if ($baseMajor -eq 0 -and $baseMinor -eq 0 -and (Test-Path "Directory.Build.props")) {
          $propsXml = [xml](Get-Content "Directory.Build.props")
          $propsVerStr = $propsXml.Project.PropertyGroup.Version
          $propsVer = $null
          if ([Version]::TryParse($propsVerStr, [ref]$propsVer)) {
            $baseMajor = $propsVer.Major
            $baseMinor = $propsVer.Minor
            $basePatch = if ($propsVer.Build -ge 0) { $propsVer.Build } else { 0 }
            $cleanTag = $propsVerStr
            Write-Host "Fallback to Directory.Build.props base: $($baseMajor).$($baseMinor).$($basePatch)"
          }
        }

        # Ensure the base tag exists locally for versioning and diffing (handles forks where tags are not mirrored)
        if ($cleanTag -and -not (git tag -l "v$cleanTag") -and -not (git tag -l "$cleanTag")) {
          try {
            Write-Host "Tag v$cleanTag not found in local clone. Fetching from upstream..."
            git fetch --force https://github.com/LenovoLegionToolkit-Team/LenovoLegionToolkit.git "refs/tags/v$cleanTag:refs/tags/v$cleanTag" 2>$null
          } catch {
            Write-Warning "Could not fetch tag from upstream: $_"
          }
        }

        $tagRef = if ($cleanTag -and (git tag -l "v$cleanTag")) { "v$cleanTag" } elseif ($cleanTag -and (git tag -l "$cleanTag")) { "$cleanTag" } else { $null }

        # Calculate version rollover based on commit count since stable release (Build cap: 20, Patch cap: 10, Minor cap: 100)
        $runNumber = 0
        $counted = $false
        if ($tagRef) {
          try {
            $commitCount = git rev-list --count "$tagRef..HEAD" 2>$null
            if ($commitCount -match '^\d+$') {
              $runNumber = [int]$commitCount
              $counted = $true
              Write-Host "Counted $runNumber commits since base tag $tagRef"
            }
          } catch {
            Write-Warning "Could not count commits from $tagRef : $_"
          }
        }
        if (-not $counted -and $env:GITHUB_RUN_NUMBER) {
          $runNumber = [int]$env:GITHUB_RUN_NUMBER
          Write-Host "Fallback to runner number: $runNumber"
        }

        $buildCap = 20
        $patchCap = 10
        $minorCap = 100

        $build = $runNumber % $buildCap
        $carriedPatches = [Math]::Floor($runNumber / $buildCap)

        $totalPatch = $basePatch + $carriedPatches
        $patch = $totalPatch % $patchCap
        $carriedMinors = [Math]::Floor($totalPatch / $patchCap)

        $totalMinor = $baseMinor + $carriedMinors
        $minor = $totalMinor % $minorCap
        $carriedMajors = [Math]::Floor($totalMinor / $minorCap)

        $major = $baseMajor + $carriedMajors

        $devVersion = "$($major).$($minor).$($patch).$($build)"
        $tagName = "v$devVersion"
        Write-Host "Resolved Dev Version: $devVersion (from Commit Count $runNumber, Base: $($baseMajor).$($baseMinor).$($basePatch)), Tag: $tagName"

        # Extract all commits since last stable tag for changelog
        $commits = @()
        $repoUrl = "https://github.com/$($env:GITHUB_REPOSITORY)"
        if ($tagRef) {
          $commits = git log "$tagRef..HEAD" --pretty=format:"* %s ([%h]($repoUrl/commit/%H))" --no-merges
        } else {
          $commits = git log --pretty=format:"* %s ([%h]($repoUrl/commit/%H))" --no-merges
        }

        $notes = if ($commits -and $commits.Count -gt 0) { ($commits -join "`n") } else { "* General stability improvements and bug fixes" }
        if ($notes.Length -gt 100000) {
          $notes = $notes.Substring(0, 100000) + "`n`n... (changelog truncated)"
        }

        "version=$devVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

        $delimiter = [guid]::NewGuid().ToString()
        "changelog<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      shell: powershell

    - name: Restore
      run: dotnet restore

    - name: Restore identity package signing key
      env:
        LLT_CERT_PFX: ${{ secrets.LLT_CERT_PFX }}
      run: |
        if (-not $env:LLT_CERT_PFX) {
          Write-Error "Missing LLT_CERT_PFX secret. The identity MSIX package cannot be signed."
          exit 1
        }

        [IO.File]::WriteAllBytes("LenovoLegionToolkit.pfx", [Convert]::FromBase64String($env:LLT_CERT_PFX))
      shell: powershell

    - name: Build
      env:
        LLT_CERT_PASSWORD: ${{ secrets.LLT_CERT_PASSWORD }}
      run: .\make_action.bat ${{ steps.resolve_version.outputs.version }}

    - name: Rename installer
      run: |
        $oldPath = "build_installer\LenovoLegionToolkitSetup.exe"
        $newPath = "build_installer\LenovoLegionToolkitSetup-v${{ steps.resolve_version.outputs.version }}.exe"
        
        if (Test-Path $oldPath) {
            Rename-Item -Path $oldPath -NewName (Split-Path $newPath -Leaf)
        } else {
            Write-Error "Build artifact not found at $oldPath"
            exit 1
        }
      shell: powershell

    - name: Verify installer
      run: |
        $installerPath = "build_installer\LenovoLegionToolkitSetup-v${{ steps.resolve_version.outputs.version }}.exe"
        if (-not (Test-Path $installerPath)) {
          Write-Error "Installer file not found at $installerPath"
          exit 1
        }
      shell: powershell

    - name: Prune Old Dev Releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        try {
          $releasesJson = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --limit 100 --json tagName,name,isPrerelease,isLatest | ConvertFrom-Json
          foreach ($rel in @($releasesJson)) {
            if ($rel.name -like '*(Dev)*') {
              if ($rel.tagName -ne '${{ steps.resolve_version.outputs.tag_name }}') {
                Write-Host "Pruning older Dev release: $($rel.tagName) ($($rel.name))"
                gh release delete $rel.tagName --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
              }
            }
          }
        } catch {
          Write-Warning "Could not prune older Dev releases: $_"
        }
      shell: powershell

    - name: Publish Dev Release
      uses: softprops/action-gh-release@v2.0.8
      with:
        tag_name: ${{ steps.resolve_version.outputs.tag_name }}
        target_commitish: dev
        prerelease: false
        make_latest: false
        generate_release_notes: false
        name: Lenovo Legion Toolkit v${{ steps.resolve_version.outputs.version }} (Dev)
        body: |
          > **Note**: Automated development build compiled from the `dev` branch.

          ### What's Changed
          ${{ steps.resolve_version.outputs.changelog }}
        files: build_installer/LenovoLegionToolkitSetup-v${{ steps.resolve_version.outputs.version }}.exe
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer-v${{ steps.resolve_version.outputs.version }}-Dev
        path: build_installer/LenovoLegionToolkitSetup-v${{ steps.resolve_version.outputs.version }}.exe
