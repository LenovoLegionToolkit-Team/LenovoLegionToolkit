name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'crowdin.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/review.yml*'
  pull_request:
    branches: [ master, dev ]
    paths-ignore:
      - '**.md'
      - 'crowdin.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/review.yml*'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-preflight:
    # Signed packages are only produced by the canonical upstream repository.
    if: github.repository == 'LenovoLegionToolkit-Team/LenovoLegionToolkit'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check signing credentials
        id: check
        env:
          LLT_CERT_PFX: ${{ secrets.LLT_CERT_PFX }}
          LLT_CERT_PASSWORD: ${{ secrets.LLT_CERT_PASSWORD }}
        run: |
          if [[ -n "$LLT_CERT_PFX" && -n "$LLT_CERT_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Signing credentials are available."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping signed build: this repository or event does not provide both signing secrets."
          fi

  build:
    needs: signing-preflight
    if: needs.signing-preflight.outputs.ready == 'true'

    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Restore
      run: dotnet restore
    - name: Restore identity package signing key
      env:
        LLT_CERT_PFX: ${{ secrets.LLT_CERT_PFX }}
      run: |
        if (-not $env:LLT_CERT_PFX) {
          Write-Error "Missing LLT_CERT_PFX secret. The identity MSIX package cannot be signed."
          exit 1
        }

        [IO.File]::WriteAllBytes("LenovoLegionToolkit.pfx", [Convert]::FromBase64String($env:LLT_CERT_PFX))
      shell: powershell
    - name: Build
      env:
        LLT_CERT_PASSWORD: ${{ secrets.LLT_CERT_PASSWORD }}
      run: .\make_action.bat
    - name: Verify installer
      run: |
        $installerPath = "build_installer\LenovoLegionToolkitSetup.exe"
        if (-not (Test-Path $installerPath)) {
          Write-Error "Installer file not found at $installerPath"
          exit 1
        }
      shell: powershell
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: build_installer\LenovoLegionToolkitSetup.exe
